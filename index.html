<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 비서실</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#17243c;margin:0}header{background:#142b50;color:white;padding:20px}main{max-width:960px;margin:auto;padding:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:9px;padding:10px 13px;background:#dfe8f5;color:#17345a;cursor:pointer}.active,button.primary{background:#2358a5;color:white}.card{background:white;border:1px solid #e1e7f0;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #1231 5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.muted{color:#65758a;font-size:13px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #bdcadb;border-radius:8px}a{color:#225ba8}.pill{font-size:12px;background:#e9f2ff;border-radius:20px;padding:4px 8px}h2{margin-top:24px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 260px;gap:14px;align-items:start}.layout>*{min-width:0}.layout .card{margin-top:0}@media(max-width:1050px){.layout{grid-template-columns:240px minmax(0,1fr)}.right{grid-column:2}}@media(max-width:650px){.layout{grid-template-columns:1fr}.right{grid-column:auto}}@media(min-width:1051px){main{max-width:1500px}}.layout aside .card button{max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.4}.layout aside .card{overflow-wrap:anywhere}#authform{display:flex;flex-direction:column;gap:8px;margin-top:12px}#authform input{margin:0}#authform button{display:block;width:100%;min-width:0;margin:0;box-sizing:border-box}#cloudstatus{overflow-wrap:anywhere;word-break:break-word}#exportdata,#importdata{display:block;width:100%;margin:8px 0;box-sizing:border-box}#details{overflow-wrap:anywhere}#details h2{font-size:18px;margin:0 0 12px}.layout>section{min-width:0}.layout nav button{flex:1 1 auto}@media(min-width:1051px){.layout{grid-template-columns:minmax(260px,290px) minmax(450px,1fr) minmax(250px,280px)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script></head><body><header><h1>AI 비서실</h1><div>무료 운영 v6 시험판 · 회의 및 업무 승인 · 선택적 무료 클라우드</div></header><main><div class="layout"><aside><section class="card" id="cloudbar"><strong>클라우드 연결</strong><p class="muted" id="cloudstatus">설정 확인 중</p><form id="authform"><input id="email" type="email" placeholder="로그인 이메일" autocomplete="email" required><input id="password" type="password" placeholder="비밀번호 (6자 이상)" minlength="6" required><button type="button" id="signup">회원가입</button> <button type="submit" class="primary">로그인</button> <button type="button" id="logout">로그아웃</button> <button type="button" id="syncnow">클라우드에서 다시 불러오기</button></form></section><section class="card"><strong>무료 운영 · 백업</strong><p class="muted">추가 유료 API 없이 동작합니다. 기기 간 동기화는 무료 Supabase 프로젝트 설정 후 사용 가능합니다. 무료 제공량 초과 시 기능이 제한될 수 있습니다.</p><button id="exportdata" type="button">전체 기록 백업(JSON)</button> <button id="importdata" type="button">백업 복원</button><input id="importfile" type="file" accept="application/json,.json" style="display:none"><p class="muted" id="backupstatus">업무일지·회의록·업무현황을 백업합니다. 복원은 현재 기록을 대체합니다.</p></section></aside><section><nav id="tabs"></nav><div id="view"></div></section><aside class="right"><div id="details" class="card"></div></aside></div></main><script>
document.getElementById('exportdata').onclick=()=>{const data=JSON.stringify({format:'ai-secretariat-v3',exportedAt:new Date().toISOString(),data:state},null,2);const a=document.createElement('a');const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download='ai-secretariat-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
document.getElementById('importdata').onclick=()=>document.getElementById('importfile').click();
document.getElementById('importfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('백업 파일은 5MB 이하만 허용합니다');const parsed=JSON.parse(await f.text());if(parsed.format!=='ai-secretariat-v3'||!parsed.data||!Array.isArray(parsed.data.logs)||!Array.isArray(parsed.data.meetings)||!Array.isArray(parsed.data.tasks))throw Error('올바른 3차 백업 파일이 아닙니다');if(!confirm('현재 업무 기록을 백업 파일로 교체할까요? 먼저 현재 기록을 백업하세요.'))return;state={logs:parsed.data.logs,meetings:parsed.data.meetings,tasks:parsed.data.tasks};save();render();document.getElementById('backupstatus').textContent='복원 완료 · '+f.name}catch(err){document.getElementById('backupstatus').textContent='복원 실패: '+err.message}finally{e.target.value=''}};
const teams=[{name:'비서실',people:[['김서연','비서실장','조직 총괄·개인 비서']]},{name:'도시개발 정보팀',people:[['이수진','팀장','정보 조사·수집·분석 총괄'],['이민재','사업정보 수집','지자체 공고·사업정보'],['이서현','도시계획·법령 분석','계획·법령 검토'],['이지훈','공간정보·콘텐츠','QGIS·콘텐츠']]},{name:'토목공학 콘텐츠팀',people:[['한지민','팀장','콘텐츠 기획·검토'],['한도윤','설계기준·시방서','KDS·KCS'],['한하은','도감·정보 구조화','도감·기준 구조화'],['한현우','해설·교육','교육 콘텐츠'],['한서진','도면·이미지','이미지 관리']]},{name:'프로그램 개발팀',people:[['정유진','팀장','개발 총괄'],['정준영','시스템 설계','DB·클라우드'],['정지우','AI 자동화','에이전트·자동화'],['정태민','웹·모바일','웹앱 개발'],['정세진','품질검증·운영','테스트·배포']]}];
const people=teams.flatMap(t=>t.people.map(p=>({name:p[0],role:p[1],detail:p[2],team:t.name})));const key='ai-office-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{logs:[],meetings:[],tasks:[]}}catch{state={logs:[],meetings:[],tasks:[]}};let tab='업무현황';let selectedTaskIndex=null;const save=()=>{localStorage.setItem(key,JSON.stringify(state));queueCloudSave()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=people.map(p=>`<option>${esc(p.name)}</option>`).join('');function render(){document.getElementById('tabs').innerHTML=['조직도','업무일지','회의실','업무현황'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let h='';if(tab==='조직도'){h='<section class="card" style="text-align:center"><h2>대표</h2><div class="muted">최종 의사결정 · 사진 없음</div></section>';teams.forEach(t=>{h+=`<h2>${t.name}</h2><div class="grid">`;t.people.forEach(p=>h+=`<article class="card"><b>${p[0]}</b> <span class="pill">${p[1]}</span><p class="muted">${p[2]}</p><button onclick="tab='업무일지';document.body.dataset.person='${p[0]}';render()">업무일지</button> <button onclick="tab='회의실';render()">회의 초대</button></article>`);h+='</div>'})}else if(tab==='업무일지'){let selected=document.body.dataset.person||people[0].name;h=`<h2>직원별 업무일지</h2><label>직원 선택<select id="person" onchange="document.body.dataset.person=this.value;render()">${people.map(p=>`<option ${p.name===selected?'selected':''}>${p.name}</option>`).join('')}</select></label><form id="logform" class="card"><input name="summary" placeholder="핵심 업무 내용" required><input name="link" type="url" placeholder="결과물 링크 (https://...) (선택)"><button class="primary" type="submit">업무 기록 추가</button><p id="logfeedback" class="muted" role="status"></p></form>`;state.logs.filter(x=>x.person===selected).slice().reverse().forEach(x=>h+=`<article class="card"><b>${esc(x.summary)}</b><p class="muted">${esc(x.time)}</p>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">결과물 열기</a>`:''}</article>`)}else if(tab==='회의실'){h=`<h2>회의실 · 업무 연계</h2><p class="muted">AI 직원의 실제 발언 생성은 아직 연결되지 않았습니다.</p><form id="meetingform" class="card"><input name="title" placeholder="회의 제목" required><label>참석자 (Ctrl 또는 길게 눌러 다중 선택)<select name="attendees" multiple size="6">${opts}</select></label><textarea name="notes" placeholder="회의 안건 및 회의록"></textarea><input name="action" placeholder="후속 업무명 (선택)"><label>후속 업무 담당자<select name="owner">${opts}</select></label><button class="primary">회의 기록 저장</button></form>`;state.meetings.slice().reverse().forEach(x=>h+=`<article class="card"><b>${esc(x.title)}</b><p class="muted">${esc(x.time)} · ${esc(x.attendees.join(', '))}</p><p>${esc(x.notes)}</p></article>`)}else{h=`<h2>업무 현황</h2><section class="card" aria-label="업무 상태 요약"><strong>업무 상태 요약</strong><p class="muted">전체 ${state.tasks.length}건 · 지시 ${state.tasks.filter(t=>t.status==='지시').length}건 · 진행 중 ${state.tasks.filter(t=>t.status==='진행 중').length}건 · 검토 요청 ${state.tasks.filter(t=>t.status==='검토 요청').length}건 · 승인 대기 ${state.tasks.filter(t=>t.status==='승인 대기').length}건 · 완료 ${state.tasks.filter(t=>t.status==='완료').length}건</p></section><form id="taskform" class="card"><input name="title" placeholder="업무명" required><textarea name="description" placeholder="업무 지시 내용"></textarea><label>담당자<select name="person">${opts}</select></label><label>마감일<input type="date" name="due"></label><button class="primary">업무 지시 등록</button></form>`;state.tasks.slice().reverse().forEach((x,i)=>h+=`<article class="card"><b>${esc(x.title)}</b><p class="muted">담당 ${esc(x.person||"미지정")} · ${esc(x.status)} · 마감 ${esc(x.due||"미지정")}</p><button type="button" onclick="selectedTaskIndex=${state.tasks.length-1-i};render()">상세 보기</button> <button type="button" onclick="selectedTaskIndex=${state.tasks.length-1-i};updateTask(${state.tasks.length-1-i})">상태 변경</button></article>`)}document.getElementById('view').innerHTML=h;const summary='<h2>업무 요약</h2><p>전체 업무 '+state.tasks.length+'건</p><p>진행 중 '+state.tasks.filter(x=>x.status==='진행 중').length+'건</p><p>승인 대기 '+state.tasks.filter(x=>x.status==='승인 대기').length+'건</p><p>회의 '+state.meetings.length+'건</p>';const selected=Number.isInteger(selectedTaskIndex)?state.tasks[selectedTaskIndex]:null;document.getElementById('details').innerHTML=summary+(selected?'<hr><h2>선택한 업무</h2><p><strong>'+esc(selected.title)+'</strong></p><p>담당자: '+esc(selected.person||'미지정')+'</p><p>마감일: '+esc(selected.due||'미지정')+'</p><p>진행 상태: <strong>'+esc(selected.status||'지시')+'</strong></p><p>업무 내용</p><p>'+esc(selected.description||'내용 없음')+'</p>'+(selected.result?'<p>업무 결과: '+esc(selected.result)+'</p>':'')+'<button type="button" onclick="updateTask(selectedTaskIndex)">상태 변경</button>':'<hr><p class="muted">가운데 업무 목록에서 상세 보기를 누르면 이곳에 내용이 표시됩니다.</p>');let f=document.getElementById('logform');if(f){const logForm=f;logForm.addEventListener('submit',e=>{
 e.preventDefault();
 const feedback=document.getElementById('logfeedback');
 try {
   const summary=logForm.querySelector('input[name="summary"]').value.trim();
   const link=logForm.querySelector('input[name="link"]').value.trim();
   if(!summary){feedback.textContent='업무 내용을 입력해 주세요.';return;}
   if(link && !/^https:\/\//i.test(link)){feedback.textContent='결과물 링크는 https:// 주소만 입력해 주세요.';return;}
   const person=document.getElementById('person').value;
   if(!Array.isArray(state.logs))state.logs=[];
   state.logs.push({person,summary,link,time:new Date().toLocaleString('ko-KR')});
   save();
   render();
   const msg=document.getElementById('logfeedback');
   if(msg)msg.textContent='브라우저에 기록 추가 완료 · 클라우드 저장 상태는 상단에서 확인하세요.';
 } catch(err) {
   feedback.textContent='기록 추가 오류: '+err.message;
   console.error('업무 기록 추가 실패',err);
 }
});}f=document.getElementById('meetingform');if(f){const meetingForm=f;meetingForm.addEventListener('submit',e=>{e.preventDefault();try{const d=new FormData(meetingForm);const title=String(d.get('title')||'').trim();if(!title){alert('회의 제목을 입력해 주세요.');return;}if(!Array.isArray(state.meetings))state.meetings=[];if(!Array.isArray(state.tasks))state.tasks=[];const attendeeSelect=meetingForm.querySelector('select[name="attendees"]');const attendees=attendeeSelect?Array.from(attendeeSelect.selectedOptions,o=>o.value):[];state.meetings.push({title,notes:String(d.get('notes')||''),attendees,time:new Date().toLocaleString('ko-KR')});const action=String(d.get('action')||'').trim();if(action)state.tasks.push({title:action,person:String(d.get('owner')||''),description:'회의 후속 업무: '+title,status:'지시',due:'',result:''});save();render();}catch(err){alert('회의 저장 오류: '+err.message);console.error('회의 저장 실패',err);}});};f=document.getElementById('taskform');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);state.tasks.push({title:d.get('title'),person:d.get('person'),description:d.get('description'),due:d.get('due'),status:'지시',result:''});save();render()}}function updateTask(i){const t=state.tasks[i];const next={'지시':'진행 중','진행 중':'검토 요청','검토 중':'승인 대기','검토 요청':'승인 대기','승인 대기':'완료','반려':'진행 중','완료':'완료'};if(t.status==='승인 대기'){const decision=prompt('대표 검토: 승인 또는 반려를 입력하세요','승인');if(decision===null)return;if(decision==='반려'){t.status='반려'}else if(decision==='승인'){t.status='완료'}else{alert('승인 또는 반려를 입력하세요');return}}else if(t.status==='완료'){alert('이미 완료된 업무입니다');return}else{t.status=next[t.status]||'진행 중';if(t.status==='검토 요청'){const result=prompt('검토할 업무 결과를 입력하세요',t.result||'');if(result===null)return;t.result=result}}save();render()}render();
let cloud=null,cloudUser=null,cloudTimer=null,cloudBusy=false;
const cloudStatus=(message)=>document.getElementById('cloudstatus').textContent=message;
function updateLoginUI(){const signed=!!cloudUser;for(const id of ['email','password','signup'])document.getElementById(id).style.display=signed?'none':'';document.querySelector('#authform button[type="submit"]').style.display=signed?'none':'';document.getElementById('logout').style.display=signed?'':'none';document.getElementById('syncnow').style.display=signed?'':'none';}
const cfg=window.CLOUD_CONFIG||{};
if(cfg.url&&cfg.anonKey&&window.supabase){
 cloud=window.supabase.createClient(cfg.url,cfg.anonKey);
 cloudStatus('연결 준비됨 · 로그인해 주세요');
 cloud.auth.getUser().then(({data})=>{if(data.user){cloudUser=data.user;updateLoginUI();loadCloud()}});
 cloud.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){cloudUser=null;updateLoginUI();cloudStatus('로그아웃됨')}else if(event==='SIGNED_IN'&&session?.user&&!cloudUser){cloudUser=session.user;updateLoginUI();setTimeout(loadCloud,0)}});
}else{cloudStatus('로컬 모드 · config.js에 Supabase 정보를 입력하면 클라우드를 사용할 수 있습니다')}
async function loadCloud(){
 if(!cloudUser||cloudBusy)return;
 cloudBusy=true;
 try{
 const {data,error}=await cloud.from('workspaces').select('data').eq('user_id',cloudUser.id).maybeSingle();
 if(error)throw error;
 if(data?.data){state={logs:data.data.logs||[],meetings:data.data.meetings||[],tasks:data.data.tasks||[]};localStorage.setItem(key,JSON.stringify(state));render();cloudStatus('클라우드 동기화 완료 · '+cloudUser.email)}
 else{const {error:insertError}=await cloud.from('workspaces').insert({user_id:cloudUser.id,data:state});if(insertError)throw insertError;cloudStatus('새 클라우드 작업공간 생성 완료 · '+cloudUser.email)}
 }catch(e){cloudStatus('동기화 오류: '+e.message)}finally{cloudBusy=false}
}
function queueCloudSave(){
 if(!cloudUser||!cloud)return;
 clearTimeout(cloudTimer);
 cloudStatus('클라우드 저장 중…');
 cloudTimer=setTimeout(async()=>{
  try {
   const {error}=await cloud.from('workspaces').upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});
   if(error)throw error;
   cloudStatus('클라우드 저장 완료 · '+cloudUser.email);
  }catch(err){cloudStatus('클라우드 저장 실패: '+err.message);console.error(err);}
 },350);
}
document.getElementById('authform').onsubmit=async(e)=>{e.preventDefault();if(!cloud)return alert('먼저 config.js를 설정하세요');const {error}=await cloud.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});cloudStatus(error?'로그인 오류: '+error.message:'로그인 완료')};
document.getElementById('signup').onclick=async()=>{if(!cloud)return alert('먼저 config.js를 설정하세요');const {error}=await cloud.auth.signUp({email:document.getElementById('email').value,password:document.getElementById('password').value});cloudStatus(error?'가입 오류: '+error.message:'가입 요청 완료 · 이메일 확인이 필요할 수 있습니다')};
document.getElementById('logout').onclick=async()=>{if(cloud)await cloud.auth.signOut();cloudUser=null;updateLoginUI();cloudStatus('로그아웃됨 · 로컬 데이터는 브라우저에 남아 있습니다')};
document.getElementById('syncnow').onclick=()=>loadCloud();
updateLoginUI();</script></body></html>
