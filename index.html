portant}.activity-empty{padding:13px;border:1px dashed #b6a3d8;border-radius:9px;background:#fff;color:#634588;font-size:12px}.activity-empty[hidden]{display:none!important}.activity-actions button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}.activity-actions button:last-child{background:#f4f0fb;color:#503884;border:1px solid #c8b8e1}.delegation-suggestion{background:#f1edfa;border-left:3px solid #7860b3;border-radius:6px;padding:10px 12px;color:#513983;font-size:12px;line-height:1.55}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script></head><body><header><h1>AI 비서실</h1><div>무료 운영 v6 시험판 · 회의 및 업무 승인 · 선택적 무료 클라우드</div></header><main><div class="layout"><aside><section class="card" id="cloudbar"><strong>클라우드 연결</strong><p class="muted" id="cloudstatus">설정 확인 중</p><form id="authform"><input id="email" type="email" placeholder="로그인 이메일" autocomplete="email" required><input id="password" type="password" placeholder="비밀번호 (6자 이상)" minlength="6" required><button type="button" id="signup">회원가입</button> <button type="submit" class="primary">로그인</button> <button type="button" id="logout">로그아웃</button> <button type="button" id="syncnow">클라우드에서 다시 불러오기</button></form></section><section class="card"><strong>무료 운영 · 백업</strong><p class="muted">추가 유료 API 없이 동작합니다. 기기 간 동기화는 무료 Supabase 프로젝트 설정 후 사용 가능합니다. 무료 제공량 초과 시 기능이 제한될 수 있습니다.</p><button id="exportdata" type="button">전체 기록 백업(JSON)</button> <button id="importdata" type="button">백업 복원</button><input id="importfile" type="file" accept="application/json,.json" style="display:none"><p class="muted" id="backupstatus">업무일지·회의록·업무현황을 백업합니다. 복원은 현재 기록을 대체합니다.</p></section></aside><section><nav id="tabs"></nav><div id="view"></div></section><aside class="right"><div id="details" class="card"></div></aside></div></main><script>
document.getElementById('exportdata').onclick=()=>{const data=JSON.stringify({format:'ai-secretariat-v3',exportedAt:new Date().toISOString(),data:state},null,2);const a=document.createElement('a');const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download='ai-secretariat-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};

document.getElementById('importfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('백업 파일은 5MB 이하만 허용합니다');const parsed=JSON.parse(await f.text());if(parsed.format!=='ai-secretariat-v3'||!parsed.data||!Array.isArray(parsed.data.logs)||!Array.isArray(parsed.data.meetings)||!Array.isArray(parsed.data.tasks))throw Error('올바른 3차 백업 파일이 아닙니다');if(!confirm('현재 업무 기록을 백업 파일로 교체할까요? 먼저 현재 기록을 백업하세요.'))return;state={logs:parsed.data.logs,meetings:parsed.data.meetings,tasks:parsed.data.tasks};save();render();document.getElementById('backupstatus').textContent='복원 완료 · '+f.name}catch(err){document.getElementById('backupstatus').textContent='복원 실패: '+err.message}finally{e.target.value=''}};
const teams=[{name:'비서실',people:[['김서연','비서실장','조직 총괄·개인 비서']]},{name:'도시개발 정보팀',people:[['이수진','팀장','정보 조사·수집·분석 총괄'],['이민재','사업정보 수집','지자체 공고·사업정보'],['이서현','도시계획·법령 분석','계획·법령 검토'],['이지훈','공간정보·콘텐츠','QGIS·콘텐츠']]},{name:'토목공학 콘텐츠팀',people:[['한지민','팀장','콘텐츠 기획·검토'],['한도윤','설계기준·시방서','KDS·KCS'],['한하은','도감·정보 구조화','도감·기준 구조화'],['한현우','해설·교육','교육 콘텐츠'],['한서진','도면·이미지','이미지 관리']]},{name:'프로그램 개발팀',people:[['정유진','팀장','개발 총괄'],['정준영','시스템 설계','DB·클라우드'],['정지우','AI 자동화','에이전트·자동화'],['정태민','웹·모바일','웹앱 개발'],['정세진','품질검증·운영','테스트·배포']]}];
const portraits={'김서연':'https://randomuser.me/api/portraits/women/44.jpg','이수진':'https://randomuser.me/api/portraits/women/68.jpg','한지민':'https://randomuser.me/api/portraits/women/32.jpg','정유진':'https://randomuser.me/api/portraits/women/26.jpg'};const people=teams.flatMap(t=>t.people.map(p=>({name:p[0],role:p[1],detail:p[2],team:t.name})));const key='ai-office-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{logs:[],meetings:[],tasks:[]}}catch{state={logs:[],meetings:[],tasks:[]}};let tab='업무현황';let selectedTaskIndex=null;let taskSearch="";let taskTeam="전체";let taskStatus="전체";let taskDueFilter="전체";function focusTasks(status,due){taskSearch="";taskTeam="전체";taskStatus=status||"전체";taskDueFilter=due||"전체";selectedTaskIndex=null;render();document.getElementById("taskResults")?.scrollIntoView({behavior:"smooth",block:"start"});}function focusTeam(i){const team=teams.slice(1)[i];if(!team)return;taskSearch="";taskTeam=team.name;taskStatus="전체";taskDueFilter="전체";selectedTaskIndex=null;render();document.getElementById("taskResults")?.scrollIntoView({behavior:"smooth",block:"start"});}async function restoreWorkspaceBackup(input){const file=input.files&&input.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('백업 파일은 10MB 이하여야 합니다.');const data=JSON.parse(await file.text());if(!data||data.format!=='ai-secretariat-backup'||data.version!==1||!data.workspace||typeof data.workspace!=='object')throw Error('지원하지 않는 백업 파일 형식입니다.');const w=data.workspace;const fields=['logs','meetings','tasks','reportArchive'];if(!fields.every(k=>Array.isArray(w[k])&&w[k].length<=10000&&w[k].every(v=>v&&typeof v==='object'&&!Array.isArray(v))))throw Error('백업 데이터 구조가 올바르지 않습니다.');const summary=fields.map(k=>k+': '+w[k].length+'건').join('\n');if(!confirm('백업 파일을 확인했습니다.\n'+summary+'\n\n현재 업무·회의·일지·보관 보고서를 모두 교체합니다. 계속할까요?'))return;if(prompt('복원을 확정하려면 복원 이라고 입력하세요.')!=='복원')return;if(!confirm('마지막 확인: 복원 전에 현재 데이터를 JSON으로 다운로드합니다. 백업 다운로드 후 확인을 눌러 교체하세요.'))return;downloadWorkspaceBackup();const next={...state,logs:w.logs,meetings:w.meetings,tasks:w.tasks,reportArchive:w.reportArchive};state=next;selectedTaskIndex=null;save();render();alert('백업 데이터를 복원했습니다. 클라우드 동기화에는 잠시 시간이 걸릴 수 있습니다.');}catch(e){alert('복원 실패: '+e.message);}finally{input.value='';}}function printApprovalSummary(){const items=(state.tasks||[]).filter(t=>['승인 대기','검토 요청','반려'].includes(t.status));const groups=[['대표 승인 대기','승인 대기'],['비서실 검토 요청','검토 요청'],['반려 · 재작업','반려']];const body='[김서연 비서실장 · 검토/승인 업무 요약]\n작성일: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+'\n총 '+items.length+'건\n\n'+groups.map(([name,status])=>{const list=items.filter(t=>t.status===status);return name+' ('+list.length+'건)\n'+(list.length?list.map(t=>'- '+t.title+' / 담당 '+(t.person||'미지정')+' / 마감 '+(t.due||'미지정')+' / 우선순위 '+(t.priority||'보통')).join('\n'):'- 해당 없음');}).join('\n\n');const w=window.open('','_blank');if(!w){alert('팝업이 차단되었습니다. 팝업을 허용해 주세요.');return;}w.document.open();w.document.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>검토·승인 업무 요약</title><style>body{font-family:system-ui,sans-serif;margin:36px;color:#17243c}h1{font-size:20px;border-bottom:2px solid #183b6d;padding-bottom:12px}pre{font:14px/1.8 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:18mm}}</style></head><body><h1>검토·승인 업무 요약</h1><pre id="report"></pre></body></html>');w.document.close();w.document.getElementById('report').textContent=body;w.focus();w.print();}function downloadApprovalSummaryTXT(){const items=(state.tasks||[]).filter(t=>['승인 대기','검토 요청','반려'].includes(t.status));const groups=[['대표 승인 대기','승인 대기'],['비서실 검토 요청','검토 요청'],['반려 · 재작업','반려']];const body='[김서연 비서실장 · 검토/승인 업무 요약]\n작성일: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+'\n총 '+items.length+'건\n\n'+groups.map(([name,status])=>{const list=items.filter(t=>t.status===status);return name+' ('+list.length+'건)\n'+(list.length?list.map(t=>'- '+t.title+' / 담당 '+(t.person||'미지정')+' / 마감 '+(t.due||'미지정')+' / 우선순위 '+(t.priority||'보통')).join('\n'):'- 해당 없음');}).join('\n\n');const blob=new Blob(['\uFEFF'+body],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='AI비서실_검토승인요약_'+new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'})+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}function copyApprovalQueueSummary(){const items=(state.tasks||[]).filter(t=>['승인 대기','검토 요청','반려'].includes(t.status));const groups=[['대표 승인 대기','승인 대기'],['비서실 검토 요청','검토 요청'],['반려 · 재작업','반려']];const textValue='[김서연 비서실장 · 검토/승인 업무 요약]\n작성일: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+'\n총 '+items.length+'건\n\n'+groups.map(([name,status])=>{const list=items.filter(t=>t.status===status);return name+' ('+list.length+'건)\n'+(list.length?list.map(t=>'- '+t.title+' / 담당 '+(t.person||'미지정')+' / 마감 '+(t.due||'미지정')+' / 우선순위 '+(t.priority||'보통')).join('\n'):'- 해당 없음');}).join('\n\n');const el=document.getElementById('approvalSummaryPreview');if(el){el.textContent=textValue;el.hidden=false;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(textValue).then(()=>{const m=document.getElementById('approvalSummaryFeedback');if(m)m.textContent='요약을 복사했습니다.';}).catch(()=>{const m=document.getElementById('approvalSummaryFeedback');if(m)m.textContent='복사 권한이 없어 화면에 요약만 표시했습니다.';});}else{const m=document.getElementById('approvalSummaryFeedback');if(m)m.textContent='요약을 화면에 표시했습니다. 내용을 선택해 복사할 수 있습니다.';}}function downloadApprovalQueueCSV(){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const selected=(state.tasks||[]).filter(t=>['승인 대기','검토 요청','반려'].includes(t.status));const columns=['업무명','현재단계','담당자','소속팀','우선순위','마감일','제출결과','결과링크','재작업횟수'];const rows=selected.map(t=>[t.title,t.status,t.person||'',t.team||'',t.priority||'보통',t.due||'',t.result||'',t.resultLink||'',t.r function queueCloudSave(){
 if(!cloudUser||!cloud)return;
 clearTimeout(cloudTimer);
 cloudStatus('클라우드 저장 중…');
 cloudTimer=setTimeout(async()=>{
  try {
   const {error}=await cloud.from('workspaces').upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});

   cloudStatus('클라우드 저장 완료 · '+cloudUser.email);

 },350);
}
